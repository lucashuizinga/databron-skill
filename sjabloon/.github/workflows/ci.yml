# Bij elke push en pull request: typen, tests, de toets op de data in de repo, en een productiebuild.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Toets
        run: pnpm toets
        env:
          # Oude data mag een codewijziging niet tegenhouden; de oogst-workflow is daar streng.
          TOETS_VERSHEID: waarschuwing
      - run: pnpm build
